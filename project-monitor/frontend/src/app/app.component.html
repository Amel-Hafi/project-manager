@if (isAuthenticated) {
<mat-toolbar color="primary">
    <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
    </button>
    <span>{{ 'app.title' | translate }}</span>
    <span class="spacer"></span>
    <span class="user-info">{{ 'auth.welcome' | translate:{ name: currentUserName } }}</span>
    <button mat-icon-button (click)="logout()" [matTooltip]="'auth.logout' | translate">
        <mat-icon>logout</mat-icon>
    </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
        <mat-nav-list>
            @for (item of navItems; track item.path) {
            @if (isNavItemVisible(item)) {
            <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle>{{ item.labelKey | translate }}</span>
            </a>
            }
            }
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
} @else {
<router-outlet />
}
