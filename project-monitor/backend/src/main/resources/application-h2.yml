spring:
  datasource:
    url: jdbc:h2:mem:projectmonitor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: project-monitor-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000

logging:
  level:
    com.projectmonitor: DEBUG
    org.hibernate.SQL: DEBUG
